<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="speakflow_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Modern Obsidian-Slate Rounded Squircle Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#speakflow_bg_grad)" />

  <!-- SpeakFlow: Open Book (Reading) + Studio Mic (Speaking) + Acoustic Sound Waves -->
  <g transform="translate(8, 8) scale(1)">
    <!-- Open Book Outline & Layered Pages -->
    <path
      d="M16 23C11.5 21 6 21.2 3.5 22.5V8.5C6 7.2 11.5 7 16 9M16 23C20.5 21 26 21.2 28.5 22.5V8.5C26 7.2 20.5 7 16 9"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Lower Page Layer Accent -->
    <path
      d="M3.5 25.2C6 23.9 11.5 23.8 16 25.6C20.5 23.8 26 23.9 28.5 25.2"
      stroke="#a7f3d0"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Acoustic Voice Waves on Left Page -->
    <path
      d="M7.5 12C6.8 13.5 6.8 16.5 7.5 18"
      stroke="#38bdf8"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M10 10.5C9 12.8 9 17.2 10 19.5"
      stroke="#bae6fd"
      stroke-width="1.8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Acoustic Voice Waves on Right Page -->
    <path
      d="M24.5 12C25.2 13.5 25.2 16.5 24.5 18"
      stroke="#38bdf8"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="none"
    />
    <path
      d="M22 10.5C23 12.8 23 17.2 22 19.5"
      stroke="#bae6fd"
      stroke-width="1.8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Central Studio Microphone -->
    <circle cx="16" cy="9.5" r="3.2" stroke="#ffffff" stroke-width="2" fill="rgba(56, 189, 248, 0.35)" />
    <line x1="13.2" y1="10.5" x2="18.8" y2="10.5" stroke="#ffffff" stroke-width="1.4" />

    <!-- Mic Handle Body -->
    <path
      d="M14.2 12.7L14.7 19.5C14.7 20.3 15.3 21 16 21C16.7 21 17.3 20.3 17.3 19.5L17.8 12.7"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="rgba(255, 255, 255, 0.22)"
    />
    <!-- Handle Dot Indicator -->
    <circle cx="16" cy="16" r="0.75" fill="#a7f3d0" />

    <!-- Microphone Audio Cable -->
    <path
      d="M16 21C16 23.5 14 24.5 12.5 24.5C11 24.5 10 23.5 10 22"
      stroke="#a7f3d0"
      stroke-width="1.6"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
